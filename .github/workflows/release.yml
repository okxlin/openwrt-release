name: Release Firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag name, for example v24.10.0-1
        required: true
      profile:
        description: ImageBuilder profile env file
        required: false
        default: configs/imagebuilder/example-x86_64.env


jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROFILE_ENV: ${{ inputs.profile || 'configs/imagebuilder/example-x86_64.env' }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install CI Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git jq rsync xz-utils zstd

      - name: Validate repository structure
        run: bash scripts/check-env.sh --mode all

      - name: Build release firmware
        run: bash scripts/build-imagebuilder.sh "$PROFILE_ENV"
        env:
          BUILD_TAG: ${{ inputs.release_tag || github.ref_name }}

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp -R dist/imagebuilder/. release-assets/

      - name: Prepare release notes
        run: |
          cat > release-assets/notes.md <<'EOF'
          Automated OpenWrt firmware release.

          This release was built from the repository's pinned ImageBuilder inputs.
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-assets/**/*
          body_path: release-assets/notes.md
