# Custom feeds for full source builds.
#
# Daed (dae proxy + LuCI): installed locally in packages/dae/ (QiuSimons/luci-app-daed)
# No external git feed needed — daed builds from source, no pre-compiled release deps.
#
# Add additional feeds below as needed, for example:
#   src-git custom_packages https://github.com/example/openwrt-packages.git;main

# MosDNS + LuCI: community feed for source builds only (not available in ImageBuilder)
#   Feed: sbwml/luci-app-mosdns (v5 branch)
#   Stock v2ray-geodata from packages feed provides v2ray-geoip/v2ray-geosite.
#   Usage: uncomment the line below, then rebuild. No additional feed needed.
#src-git mosdns https://github.com/sbwml/luci-app-mosdns;v5
