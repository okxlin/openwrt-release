# Custom feeds loaded BEFORE official packages (higher priority).
#
# Order matters: custom feeds listed here override same-named packages
# in the official feeds.conf.default. This is intentional for passwall-packages
# which provides newer versions of xray-core, sing-box, etc.

# PassWall2 v2 proxy suite
src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main

# OpenClash proxy tool
src-git openclash https://github.com/vernesong/OpenClash;master

# MosDNS DNS forwarder
src-git mosdns https://github.com/sbwml/luci-app-mosdns;v5

# Daed (dae proxy + LuCI): installed locally in packages/dae/
# (QiuSimons/luci-app-daed kix branch)
# No feed entry needed — OpenWrt auto-discovers packages/dae/ subdirectories.
